<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Análisis de Narrativas: Las Mañaneras</title>
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #ffffff; /* Fondo totalmente blanco */
      --card-bg: #ffffff;
      --border-color: #e2e8f0;
      --morena-guinda: #691c32; /* Guinda Institucional */
      --morena-guinda-light: #fcf4f6;
      --morena-gold: #b38e5d; /* Dorado complementario */
      --text-main: #0f172a;
      --text-muted: #475569;
      --font-family: 'Plus Jakarta Sans', sans-serif;
      --shadow-sm: 0 1px 3px rgba(0,0,0,0.05);
      --shadow-md: 0 4px 12px rgba(0,0,0,0.05);
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: var(--font-family);
      font-weight: 400;
      background-color: var(--bg);
      color: var(--text-main);
      margin: 0;
      padding: 2.5rem 1rem;
      display: flex;
      flex-direction: column;
      align-items: center;
      line-height: 1.6;
    }

    .main-header {
      text-align: center;
      max-width: 900px;
      margin-bottom: 2.5rem;
    }

    .main-header h1 {
      font-weight: 700;
      font-size: 2.25rem;
      color: var(--morena-guinda);
      margin: 0 0 0.5rem 0;
      letter-spacing: -0.025em;
    }

    .main-header p.subtitle {
      color: var(--text-muted);
      font-size: 1.1rem;
      font-weight: 500;
      margin: 0 0 0.4rem 0;
    }

    .main-header p.sub-subtitle {
      color: var(--morena-gold);
      font-size: 0.95rem;
      font-weight: 600;
      margin: 0;
    }

    /* Navegador de Línea de Tiempo */
    .timeline-wrapper {
      width: 100%;
      max-width: 1000px;
      position: relative;
      margin-bottom: 2.5rem;
      padding: 0.5rem 0;
    }

    .timeline-container {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      position: relative;
    }

    .timeline-line {
      position: absolute;
      top: 13px;
      left: 1.5rem;
      right: 1.5rem;
      height: 3px;
      background: var(--border-color);
      z-index: 1;
    }

    .node-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 0.5rem;
      z-index: 2;
      cursor: pointer;
      background: none;
      border: none;
      padding: 0;
      font-family: inherit;
    }

    .node {
      background: #ffffff;
      border: 3px solid #94a3b8;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .node-label {
      font-size: 0.875rem;
      font-weight: 600;
      color: var(--text-muted);
      transition: color 0.2s ease;
    }

    .node-wrapper:hover .node {
      border-color: var(--morena-guinda);
      transform: scale(1.1);
    }

    .node-wrapper.active .node {
      background: var(--morena-guinda);
      border-color: var(--morena-guinda);
      transform: scale(1.25);
      box-shadow: 0 0 0 4px var(--morena-guinda-light);
    }

    .node-wrapper.active .node-label {
      color: var(--morena-guinda);
      font-weight: 700;
    }

    /* Contenedor de Tabla / Tarjeta */
    .content-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 2rem;
      width: 100%;
      max-width: 1000px;
      box-shadow: var(--shadow-md);
      transition: opacity 0.2s ease, transform 0.2s ease;
      opacity: 1;
      transform: translateY(0);
    }

    .content-card.fade-out {
      opacity: 0;
      transform: translateY(6px);
    }

    .card-title {
      font-weight: 700;
      margin: 0 0 1.5rem 0;
      font-size: 1.5rem;
      color: var(--morena-guinda);
      border-bottom: 2px solid var(--morena-guinda-light);
      padding-bottom: 0.75rem;
    }

    /* Tabla de Narrativas */
    .table-responsive {
      width: 100%;
      overflow-x: auto;
    }

    .narrative-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.92rem;
    }

    .narrative-table th {
      background-color: var(--morena-guinda);
      color: #ffffff;
      font-weight: 600;
      padding: 1rem;
      border: 1px solid var(--morena-guinda);
    }

    .narrative-table td {
      padding: 1rem;
      border: 1px solid var(--border-color);
      vertical-align: top;
    }

    .narrative-table tr:nth-child(even) {
      background-color: #fafafa;
    }

    .narrative-title {
      font-weight: 700;
      color: var(--text-main);
    }

    .percentage-badge {
      display: inline-block;
      background: var(--morena-guinda-light);
      color: var(--morena-guinda);
      font-weight: 700;
      padding: 0.3rem 0.6rem;
      border-radius: 6px;
      border: 1px solid rgba(105, 28, 50, 0.15);
      text-align: center;
    }

    .narrative-table ul {
      margin: 0;
      padding-left: 1.2rem;
    }

    .narrative-table li {
      margin-bottom: 0.5rem;
    }

    .narrative-table li:last-child {
      margin-bottom: 0;
    }

    /* Responsividad */
    @media (max-width: 768px) {
      body {
        padding: 1.5rem 0.75rem;
      }

      .timeline-wrapper {
        overflow-x: auto;
        padding-bottom: 1rem;
      }

      .timeline-container {
        min-width: 650px;
        padding: 0 1rem;
      }

      .content-card {
        padding: 1.25rem;
      }

      .narrative-table th, 
      .narrative-table td {
        padding: 0.75rem;
      }
    }
  </style>
</head>
<body>

  <header class="main-header">
    <h1>Cobertura Mediática de Las Mañaneras</h1>
    <p class="subtitle">Narrativas más repetidas, porcentajes y encuadre (2019 -2026)</p>
    <p class="sub-subtitle">1,872 conferencias matutinas analizadas en su versión estenográfica</p>
  </header>

      <div class="timeline-line"></div>

  </nav>

  <main class="content-card" id="card-display" aria-live="polite"></main>

  <script>

function selectYear(year, element) {
      document.querySelectorAll('.node-wrapper').forEach(n => n.classList.remove('active'));
      element.classList.add('active');

      const card = document.getElementById('card-display');
      card.classList.add('fade-out');

      setTimeout(() => {
        const yearObj = data[year];
        
        if (!yearObj) {
          card.innerHTML = `
            <h2 class="card-title">Mañaneras — Año ${year}</h2>
            <p style="color: var(--text-muted);">Pendiente por agregar los datos de este año.</p>
          `;
        } else {
          let headersHtml = yearObj.headers.map(h => `<th style="width: ${h.width};">${h.name}</th>`).join('');
          let rowsHtml = '';

          if (yearObj.type === 'detailed') {
            rowsHtml = yearObj.rows.map(item => `
              <tr>
                <td class="narrative-title">${item.narrativa}</td>
                <td><span class="percentage-badge">${item.porcentaje}</span></td>
                <td>
                  <ul>
                    ${item.mensajes.map(m => `<li>${m}</li>`).join('')}
                  </ul>
                </td>
                <td>
                  <ul>
                    ${item.estrategia.map(e => `<li>${e}</li>`).join('')}
                  </ul>
                </td>
              </tr>
            `).join('');
          } else if (yearObj.type === 'simple') {
            rowsHtml = yearObj.rows.map(item => `
              <tr>
                <td class="narrative-title">${item.narrativa}</td>
                <td><span class="percentage-badge">${item.porcentaje}</span></td>
                <td>${item.explicacion}</td>
              </tr>
            `).join('');
          } else if (yearObj.type === 'deep') {
            rowsHtml = yearObj.rows.map(item => `
              <tr>
                <td class="narrative-title">${item.narrativa}</td>
                <td><span class="percentage-badge">${item.porcentaje}</span></td>
                <td>${item.resumen}</td>
                <td><em>${item.elementos}</em></td>
              </tr>
            `).join('');
          /* AQUÍ ESTÁ EL BLOQUE QUE TE FALTABA PARA 2022 */
          } else if (yearObj.type === 'summary') {
            rowsHtml = yearObj.rows.map(item => `
              <tr>
                <td class="narrative-title">${item.narrativa}</td>
                <td><span class="percentage-badge">${item.porcentaje}</span></td>
                <td>${item.resumen}</td>
              </tr>
            `).join('');
          }

          card.innerHTML = `
            <h2 class="card-title">Análisis de Narrativas — ${year}</h2>
            <div class="table-responsive">
              <table class="narrative-table">
                <thead>
                  <tr>${headersHtml}</tr>
                </thead>
                <tbody>
                  ${rowsHtml}
                </tbody>
              </table>
            </div>
          `;
        }
        card.classList.remove('fade-out');
      }, 150);
    }

    // Cargar 2019 al inicio
    selectYear(2019, document.querySelector('.node-wrapper'));
  </script>
